[project]
name = "caries-segmentation"

[data]
preprocessed_path = "data/preprocessed"
sources = ["DC1000"]  # Filter by source in data.csv, empty = all
images_size = [256, 256]

[model]
n_channels = 1
n_classes = 1
depth = 4
base_channels = 64

[training]
task = "tooth_detection"  # "segmentation", "tooth_detection", "unet_with_yolo_boxes", or "yolo_unet_conjunction"
epochs = 20
batch_size = 16
learning_rate = 5e-4
weight_decay = 1e-5
num_workers = 0
output_dir = "checkpoints"
seed = 42
shuffle_train = false  # Set to false to use same batch every epoch (for testing)

# Class imbalance weights (443:1 ratio from compute_class_ratio.py)
bce_pos_weight = 200.0  # Weight for caries class in BCE loss (use 10.0 for more aggression)
dice_weight = [1.0, 200.0]  # [background, caries] weights for Dice loss

# Feature toggles
early_stopping = false  # Enable early stopping
early_stopping_patience = 10
checkpointing = false  # Enable model checkpointing
lr_scheduler = false  # Enable learning rate scheduler (ReduceLROnPlateau)

[tooth_detection]
data_dir = "data/preprocessed_detection"
output_dir = "checkpoints/detection"
device = "auto"
image_size = 640  # YOLO input is resized to image_size x image_size
anchors = [[10.0, 13.0], [16.0, 30.0], [33.0, 23.0], [30.0, 61.0], [62.0, 45.0], [59.0, 119.0]]
max_detections = 32
nms_iou_threshold = 0.65
eval_split = "test"  # train, val, or test
score_threshold = 0.25
eval_iou_threshold = 0.5
use_unet_conjunction = false
detector_checkpoint = "checkpoints/detection/detector_best.pt"
unet_checkpoint = "checkpoints/best_model.ckpt"
unet_mask_threshold = 0.5
unet_crop_padding = 0.05

[wandb]
project = "caries-segmentation"
entity = ""
