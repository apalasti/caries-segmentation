[project]
name = "moderate-data-science"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=1.4.0",
    "lightning>=2.6.1",
    "numpy>=2.4.3",
    # Headless build avoids X11 deps (e.g. libxcb) on HPC/containers.
    # Roboflow pins this exact version, so keep them compatible.
    "opencv-python-headless==4.10.0.84",
    "pandas<3.0.0",
    "pillow>=12.1.1",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.2",
    "pytorch-lightning>=2.6.1",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "roboflow>=1.2.16",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tomli>=2.4.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "wandb>=0.25.1",
]

[dependency-groups]
dev = [
    "gdown>=5.2.1",
]

[tool.uv.workspace]
members = [
    "src/basic-u-net",
]
