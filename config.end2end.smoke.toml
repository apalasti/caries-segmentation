[project]
name = "caries-segmentation"

[data]
preprocessed_path = "data/preprocessed"
sources = []
images_size = [256, 256]

[model]
n_channels = 1
n_classes = 1
depth = 4
base_channels = 32

[training]
task = "end2end_joint"
epochs = 1
batch_size = 2
learning_rate = 5e-4
weight_decay = 1e-5
num_workers = 0
output_dir = "checkpoints"
seed = 42
shuffle_train = false

early_stopping = false
checkpointing = false
lr_scheduler = false

[tooth_detection]
data_dir = "data/preprocessed_detection"
output_dir = "checkpoints/detection"
device = "auto"
image_size = 256
anchors = [[10.0, 13.0], [16.0, 30.0], [33.0, 23.0], [30.0, 61.0], [62.0, 45.0], [59.0, 119.0]]
max_detections = 16
nms_iou_threshold = 0.65
eval_split = "test"
score_threshold = 0.25
eval_iou_threshold = 0.5

[end2end]
output_dir = "checkpoints/end2end_smoke"
checkpoint = "checkpoints/end2end_smoke/end2end_best.pt"
device = "auto"
train_with_gt_boxes_prob = 0.5
segmenter_in_channels = 1
unet_input_size = [128, 128]
mask_threshold = 0.5
crop_padding_ratio = 0.05
min_crop_size = 2
bbox_padding = 10.0
save_sanity_report = true
sanity_report_path = "outputs/end2end_sanity_smoke_test.json"

[wandb]
project = "caries-segmentation"
entity = ""
